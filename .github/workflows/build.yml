name: Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Make .icns icon
        run: |
          mkdir icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png
          iconutil -c icns icon.iconset

      - name: Build .app
        run: |
          pyinstaller --windowed --onedir -y \
            --name "IVS Conversion App" \
            --icon icon.icns \
            --add-data "icon.png:." \
            --add-data "check.png:." \
            --collect-all PIL \
            --collect-all reportlab \
            --collect-all PyQt6 \
            --hidden-import PIL.TiffImagePlugin \
            --hidden-import PIL.PngImagePlugin \
            --hidden-import PIL.JpegImagePlugin \
            main.py

      - name: Zip .app
        run: |
          cd dist
          zip -r "IVS-Conversion-App-macOS.zip" "IVS Conversion App.app"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IVS-Conversion-App-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --windowed --onefile -y `
            --name "IVS Conversion App" `
            --icon icon.ico `
            --add-data "icon.png;." `
            --add-data "check.png;." `
            --collect-all PIL `
            --collect-all reportlab `
            --collect-all PyQt6 `
            --hidden-import PIL.TiffImagePlugin `
            --hidden-import PIL.PngImagePlugin `
            --hidden-import PIL.JpegImagePlugin `
            main.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/IVS Conversion App.exe"
